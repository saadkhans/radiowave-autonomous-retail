[project]
name = "radiowave-autonomous-retail"
version = "0.1.0"
description = "Vendor-neutral autonomous retail R&D platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "polars>=1.7,<2",
  "pyarrow>=17,<20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
